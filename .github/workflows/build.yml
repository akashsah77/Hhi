name: Build Kissa AI Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    env:
      APP_BUILD_NUMBER: ${{ github.run_number }}
      KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      RELEASE_BUILD_ENABLED: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        run: ./gradlew --version --no-daemon

      - name: Create temporary debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA \
              -keysize 2048 -validity 10000 -noprompt
          fi

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug APK for pull requests
        if: github.event_name == 'pull_request' || env.RELEASE_BUILD_ENABLED != 'true'
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare production signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && \
             [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "RELEASE_BUILD_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "Production signing secrets are not configured; building a downloadable debug APK only."
            echo "RELEASE_BUILD_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK and AAB
        if: github.event_name != 'pull_request' && env.RELEASE_BUILD_ENABLED == 'true'
        run: ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        if: github.event_name == 'pull_request' || env.RELEASE_BUILD_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload release APK
        if: github.event_name != 'pull_request' && env.RELEASE_BUILD_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB (Google Play)
        if: github.event_name != 'pull_request' && env.RELEASE_BUILD_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always() && github.event_name != 'pull_request'
        run: rm -f "$KEYSTORE_PATH"
